<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141324" />
      <stop offset="50%" stop-color="#0c0d15" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Gold Core Gradient -->
    <linearGradient id="goldCore" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Secondary Flare Gradient -->
    <linearGradient id="secFlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.7" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base with Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.75" />

  <!-- Ambient Radial Glow -->
  <circle cx="32" cy="32" r="26" fill="url(#centerGlow)" />

  <!-- Celestial Orbit Ring -->
  <circle cx="32" cy="32" r="22" stroke="url(#goldCore)" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.45" />

  <!-- Diagonal Secondary 4-Point Star -->
  <g transform="rotate(45 32 32)">
    <path d="M 32 15 Q 32 32 15 32 Q 32 32 32 49 Q 32 32 49 32 Q 32 32 32 15 Z" fill="url(#secFlare)" />
  </g>

  <!-- Primary Majestic 4-Point Celebration Star -->
  <path d="M 32 8 Q 32 32 8 32 Q 32 32 32 56 Q 32 32 56 32 Q 32 32 32 8 Z" fill="url(#goldCore)" />

  <!-- Corner Celebration Sparkles -->
  <path d="M 17 14 Q 17 17 14 17 Q 17 17 17 20 Q 17 17 20 17 Q 17 17 17 14 Z" fill="#fde68a" opacity="0.85" />
  <path d="M 47 14 Q 47 17 44 17 Q 47 17 47 20 Q 47 17 50 17 Q 47 17 47 14 Z" fill="#fde68a" opacity="0.85" />
  <path d="M 17 44 Q 17 47 14 47 Q 17 47 17 50 Q 17 47 20 47 Q 17 47 17 44 Z" fill="#fde68a" opacity="0.7" />
  <path d="M 47 44 Q 47 47 44 47 Q 47 47 47 50 Q 47 47 50 47 Q 47 47 47 44 Z" fill="#fde68a" opacity="0.7" />

  <!-- Center Diamond Core Jewel -->
  <circle cx="32" cy="32" r="4" fill="#ffffff" />
  <circle cx="32" cy="32" r="2" fill="#fffbeb" />
</svg>
